[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heritageguard"
version = "0.1.0"
description = "HeritageGuard concept prototype backend. All data is hypothetical."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.70",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "neo4j>=5.20",
    "supabase>=2.5",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
    "faker>=26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["hg*", "api*"]

[tool.setuptools.package-data]
"hg" = ["**/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j (docker compose locally, service container in CI)",
]
